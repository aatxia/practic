name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Cache MediaPipe model bundles
        uses: actions/cache@v4
        with:
          path: models/mediapipe
          key: mediapipe-models-v1

      - name: Download MediaPipe model bundles
        run: bash scripts/download_mediapipe_models.sh

      # MediaPipe's Tasks C library dlopen()s the EGL/GLES/GL stack at
      # import time even for CPU-only inference -- none of it present on
      # the default runner image.
      - name: Install MediaPipe's system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: cd backend && pytest tests -q

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-training.txt

      - name: Cache MediaPipe model bundles
        uses: actions/cache@v4
        with:
          path: models/mediapipe
          key: mediapipe-models-v1

      - name: Download MediaPipe model bundles
        run: bash scripts/download_mediapipe_models.sh

      # MediaPipe's Tasks C library dlopen()s the EGL/GLES/GL stack at
      # import time even for CPU-only inference -- none of it present on
      # the default runner image.
      - name: Install MediaPipe's system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1

      - name: Install ML dependencies
        run: pip install -r ml/requirements-training.txt

      - name: Run ML tests
        run: cd ml && pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
